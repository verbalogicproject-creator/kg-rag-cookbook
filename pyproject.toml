[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlke-hybrid"
version = "0.1.0"
description = "Declared local-cloud hybrid KG-RAG pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "NLKE"}]
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "google-genai>=1.0",
]

# `declared-core` is deliberately NOT listed above, and that is not an oversight.
#
# It used to be `declared-core @ file:///root/projects/declared_core`, which made
# this project installable on exactly one machine: an absolute path that exists
# nowhere else, for a repository that is private, so neither the path nor a
# `git+https://` URL is portable.
#
# More importantly, pip is the wrong installer for it. `src/nlke_hybrid/declared_core.py`
# is a *strict* adapter: it compares `declared_core.__file__` against the path
# declared in `hybrid-rag.json` and refuses a copy it cannot identify. Under
# PEP 660, `pip install -e` does not put the source directory on `sys.path` —
# it installs an editable *proxy* finder, so `__file__` resolves into
# site-packages and the adapter correctly rejects it. Declaring declared-core as
# a pip dependency therefore produces an install that is broken by construction.
#
# It is a sibling working copy, pinned by revision and tree hash in
# `hybrid-rag.json`, and it goes on the path with a `.pth` file holding the
# sibling's directory. See README "Install". A missing or non-canonical copy
# raises `IdentityError` naming the fix, rather than importing something it
# cannot vouch for.

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
nlke-hybrid = "nlke_hybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
