[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlke-hybrid"
version = "0.1.0"
description = "Declared local-cloud hybrid KG-RAG pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "NLKE"}]
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "google-genai>=1.0",
  "declared-core @ file:///root/projects/declared_core",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
nlke-hybrid = "nlke_hybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
