# Curated findings and edges.
#
# Every finding is one falsifiable sentence plus a source. Comparative claims
# carry a statistical gate or they are recorded DIRECTIONAL / NOT_ESTABLISHED —
# a persuasive story is not a gate. Negative results get equal treatment.
#
# `verified_here: true` means this builder re-derived the number itself, and the
# command is in evidence.source. `false` means the finding is cited from the
# estate and has NOT been independently re-run — a distinction that matters more
# than the status label.

schema: kg-rag-of-kg-rags/curated-findings/1.0

findings:

  # --- retrieval architecture ------------------------------------------------
  - id: scoped-indexes-beat-one-index
    name: "Physically separate indexes beat one index with a post-hoc filter"
    category: retrieval
    claim_type: comparative
    status: ESTABLISHED
    verified_here: false
    claim: >-
      Routing a query to one of five physically separate BM25 indexes scores 75/75
      on the gold set, against 67/75 for a single unrouted index, and 57/75 when
      139 recipe documents are ingested into that same single index — because a
      filter applied after search cannot undo BM25 corpus statistics already
      perturbed by an unrelated document.
    evidence:
      source: "NLKE-primitives-library:README.md 'How it fits together', tools/select.py:170-215, tools/measure_retrieval.py"
      result: "75/75 routed · 67/75 unrouted · 57/75 merged"
      n: "75 gold questions"

  - id: corpus-lifts-answering
    name: "The declared corpus measurably improves an answering model"
    category: measurement
    claim_type: comparative
    status: ESTABLISHED
    verified_here: false
    claim: >-
      Supplying retrieved corpus context raises correct answers from 4/20 to 14/20
      on a held-out question set, at exact McNemar p=0.0020 — the corpus helps an
      agent answer, end to end, rather than merely retrieving plausibly.
    evidence:
      source: "NLKE-primitives-library:tools/measure_sot.py (ESTABLISHED 2026-07-27)"
      result: "arm A 4/20 -> arm B 14/20, exact McNemar p=0.0020"
      n: "20 questions, gated on discordant flips"

  - id: dense-wins-rank1-only
    name: "Dense retrieval's advantage over lexical is confined to rank 1"
    category: retrieval
    claim_type: comparative
    status: DIRECTIONAL
    verified_here: false
    claim: >-
      On paraphrase queries a dense signal wins decisively at rank 1, and the
      advantage has disappeared by ranks 4-10 — so an embedding buys precision at
      the top of the list and little else, which is the wrong trade when the
      consumer reads k=4.
    evidence:
      source: "NLKE-primitives-library:README.md 'Three probes with negative and positive findings recorded as first-class'"
      result: "dense wins at rank 1; advantage gone by rank 4-10"
      n: "not stated in the source — recorded DIRECTIONAL for that reason"

  # --- the admission gate ----------------------------------------------------
  - id: parent-boost-regression
    name: "A signal an LLM certified as clean regressed held-out recall"
    category: measurement
    claim_type: existential
    status: ESTABLISHED
    verified_here: false
    claim: >-
      A parent-boost signal — propagate a matched child's score to its parent —
      passed an LLM-based compatibility check as clean and then moved held-out
      recall from 0.895 to 0.842, having learned to promote well-connected items
      rather than relevant ones.
    evidence:
      source: "NLKE-mud-detection:README.md (the incident the package was built from)"
      result: "recall 0.895 -> 0.842"
      n: "n/a"

  - id: correlation-alone-does-not-convict
    governed_by: measurement
    name: "Redundancy is the conjunction of high correlation and low failure-rescue"
    category: measurement
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      A candidate signal is judged redundant only when it both correlates with the
      base ranking and fails to rescue the base's failures; either condition alone
      is insufficient, because a good signal often agrees with the base and a
      precision-only signal often rescues nothing.
    evidence:
      source: "NLKE-mud-detection:mud_detection/correlate.py:75,97-120 (rho + rescue fraction), screen.py:59-82"
      result: "screen() requires both signatures; worst verdict wins across nuisance variables"
      n: "n/a"

  # --- generation 1: what unadjudicated plurality costs ----------------------
  - id: gen1-fusion-unadjudicated
    name: "Generation 1 ships four mutually incompatible fusion formulas"
    category: retrieval
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Four different fusion formulas coexist in one estate with no gate choosing
      between them — rank-based RRF, a normalised alpha dense/bm25 blend, an
      eight-intent alpha/beta/gamma table, and a fixed 0.6/0.4 blend — so there is
      no answer to "how do we fuse" that a new consumer can read off.
    evidence:
      source: "flags:eco-system/{unified_retriever,hybrid_retriever,fusion_weights,semantic_retriever}.py"
      result: "4 formulas, 0 adjudications"
      n: "n/a"

  - id: gen1-dimension-counts-contradict
    name: "Generation 1's dimension registries state six incompatible counts"
    category: declaration
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Six registries declare 44, 46, 56, 80, 640-claimed-94-defined and 196
      dimensions, with one file contradicting itself between its header and a
      method docstring, and the only migration bridge carrying a stale label of
      its own.
    evidence:
      source: "flags:eco-system/embeddings/{enhanced_dimension_scorer,hybrid_embedder,dimension_config}.py; dimensions/{extended_schema,schema_bridge}.py; unified_embedding_retriever.py:8 vs :126; python-scripts/llm_brain_extractor.py"
      result: "6 counts, 1 intra-file contradiction, 1 stale bridge"
      n: "n/a"

  - id: dimension-scoring-is-keyword-heuristic
    name: "No dimension score in the estate is produced by a model or learned"
    category: declaration
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Every interpretable-dimension scorer is keyword matching plus fixed baselines,
      and one adds deterministic hash-seeded jitter — including the file named
      llm_brain_extractor, which makes no model call to produce dimension values.
    evidence:
      source: "flags:eco-system/embeddings/dimension_config.py:701-724, enhanced_dimension_scorer.py:138-146,147-213; python-scripts/llm_brain_extractor.py:1344-1374"
      result: "3 of 3 scorers are heuristics; 1 injects hash_based_variance()"
      n: "n/a"

  - id: gen1-orchestrators-reference-dead-paths
    governed_by: absence-is-not-a-result
    name: "Both generation-1 orchestrators point at databases that do not exist"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      ecosystem.py and node_ai_repl.py hardcode four absolute database paths, all
      four of which are missing, and one whose parent directory is absent entirely
      — so neither can run against its declared defaults.
    evidence:
      source: "flags:eco-system/ecosystem.py:76-77; node-ai/node_ai_repl.py:72-73 — verified by `test -e` on each path, 2026-09-01"
      result: "4 of 4 paths missing"
      n: "n/a"

  # --- properties of generation 2, found while building this graph -----------
  - id: kg-toolkit-created-at-breaks-byte-reproducibility
    name: "kg_toolkit stamps wall-clock time into every row"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      kg_toolkit writes datetime.now() into a created_at column on both nodes and
      edges, so two builds of identical content produce different bytes and no
      kg_toolkit database can be byte-compared by a raw dump — the storage engine
      cannot satisfy the determinism discipline it ships alongside.
    evidence:
      source: "kg_toolkit:kg_toolkit/store.py:37 — reproduced by building this graph twice and diffing iterdump(), 1280 of 2648 lines differed on created_at alone"
      result: "1280/2648 dump lines differ between identical builds"
      n: "n/a"

  - id: status-vocabulary-drift
    name: "The corpus uses statuses its own schema does not declare"
    category: declaration
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      method-primitive-schema declares five statuses, and the corpus uses eight —
      OBSERVED, MEASURED and PAUSE appear on 9 of 43 entries (21%) without being
      declared anywhere, so a validator enforcing the schema would discard a fifth
      of the library.
    evidence:
      source: "NLKE-primitives-library:schema/method-primitive-schema.ngf.md vs `grep -rhoE '^\\s*status:\\s*[A-Z_]+' --include='*.ngf.md'`, 2026-09-01"
      result: "ESTABLISHED 20 · OBSERVED 7 · CONVENTION 6 · DIRECTIONAL 4 · REFUTED 3 · PAUSE 1 · NOT_ESTABLISHED 1 · MEASURED 1"
      n: "43 status values"

  - id: build-artifacts-inflate-inventory
    name: "Artifact directories inflate a naive source inventory by ~30%"
    category: measurement
    claim_type: comparative
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Six packages carry a build/ directory holding 205 duplicated .py files, so a
      file walk that skips only __pycache__/.venv/.git/node_modules overcounts the
      estate by 212 files and 30,065 lines — 101,110 reported against 71,045 actual.
    evidence:
      source: "Measured by this builder: SKIP_DIRS including build/dist gives 534 files / 71,045 LOC; the four-exclusion walk gives 746 / 101,110. Both re-runnable, 2026-09-01"
      result: "746 -> 534 files; 101,110 -> 71,045 LOC; test counts unaffected"
      n: "13 IN packages"

  - id: duplicate-declared-ids
    governed_by: absence-is-not-a-result
    name: "Declared ids collide inside a corpus whose schema requires dedupe"
    category: declaration
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Three declared ids appear more than once across the ingested cards, including
      one method-primitive id used twice inside the library whose own schema says
      to dedupe before adding — and a node scheme keyed on declared id would have
      silently collapsed them.
    evidence:
      source: "Measured by this builder's declared_id_collisions check, 2026-09-01: card ngfify/sample x4, card project_memory/sample x4, finding NLKE-primitives-library/declarations-must-distinguish x2"
      result: "3 colliding declared ids"
      n: "529 cards, 41 findings"

  - id: declared-core-vendored-five-times-in-sync
    name: "declared_core exists as six trees that currently agree"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Five packages vendor declared_core 0.1.0 at an identical blake2b digest and
      the upstream tree matches byte for byte, so the estate holds six copies of one
      package held in agreement by discipline alone — which is the cheapest moment
      to collapse them and the last moment before a divergence has no oracle.
    evidence:
      source: "VENDORED.json in NLKE-mud-detection, declared_rules, frontmatter_rag, kg_toolkit, project_memory (all blake2b:b1c4aa1c8fa709ba96f113ebe7…), plus `diff -rq frontmatter_rag/declared_core declared_core/declared_core` clean, 2026-09-01"
      result: "5 vendored copies + 1 upstream, 0 differences"
      n: "n/a"

  - id: recursive-cycle-check-cannot-run-on-deep-graphs
    governed_by: absence-is-not-a-result
    name: "kg_toolkit's cycle check raises on the graphs most likely to have cycles"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      integrity.py:_find_cycle recurses once per node, so on a 50,000-node chain it
      raises RecursionError against CPython's default limit of 1000 rather than
      returning a verdict — a cycle check that cannot run on a deep graph is not a
      cycle check, and the failure is loudest exactly where cycles are likeliest.
    evidence:
      source: "kg_toolkit:kg_toolkit/integrity.py:258 _find_cycle — reproduced 2026-09-01 by calling it with a 50,000-edge chain; raises RecursionError. The TypeScript port multi-graph-memory:src/kg/integrity.ts findCycle() is iterative and returns the same answer at that depth (test/kg.integrity.test.ts)."
      result: "Python: RecursionError at depth 50,000 (limit 1000). TypeScript port: returns correctly."
      n: "n/a"

  - id: pragma-without-foreign-keys-enforces-nothing
    governed_by: absence-is-not-a-result
    name: "A foreign-key pragma with no foreign keys declared enforces nothing"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      multi-graph-memory sets PRAGMA foreign_keys = ON while not one of its four
      tables declares a FOREIGN KEY, so referential integrity was inferred from the
      presence of the pragma rather than enforced by it — the protection reads as
      present in the source and is absent at runtime.
    evidence:
      source: "multi-graph-memory:src/adapters/sqlite.ts:455 (pragma) vs the SCHEMA DDL — grepped for FOREIGN KEY/REFERENCES across events, episodes, lessons, evidence, 2026-09-01: zero matches."
      result: "1 pragma, 0 foreign keys, 4 tables"
      n: "n/a"

  - id: dangling-reference-skipped-not-reported
    governed_by: absence-is-not-a-result
    name: "A dangling graph reference was skipped rather than reported"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      The visualization exporter declines to draw an edge whose endpoint is missing
      and says nothing about it — correct not to invent a node, and the reason a
      dangling reference had no way to become visible until an integrity check
      existed to name it.
    evidence:
      source: "multi-graph-memory:src/visualization/exporter.ts:179-181; closed by src/kg/integrity.ts dangling_edges (test/kg.integrity.test.ts)"
      result: "skipped silently before; reported with subject and reason now"
      n: "n/a"

  - id: silent-fallback-is-a-class-not-an-incident
    governed_by: absence-is-not-a-result
    name: "Silent degradation is a cross-codebase class, now seen in four"
    category: tooling
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      The same failure shape — a component that degrades, falls back or skips
      without recording that it did — has now been found independently in four
      unrelated codebases, which makes it a class rather than four incidents, and
      means anything that can fall back must either raise or record that it fell
      back.
    evidence:
      source: "kg-rag-cookbook:COOKBOOK.ngf.md §8 X1 (two codebases, logged 2026-08-01); X1c multi-graph-memory:src/adapters/sqlite.ts:455; X1d multi-graph-memory:src/visualization/exporter.ts:179; kg_toolkit:integrity.py predecessor dropped bad edges silently (integrity.py:1-12)"
      result: "4 independent codebases, same shape"
      n: "n/a"

  - id: typed-not-extracted-is-a-class
    governed_by: provenance
    name: "A number typed into a document is a claim with no gate on it"
    category: measurement
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      Two numbers hand-typed into this estate's own release document were wrong and
      neither was caught by review — the LOC total, inflated 30% by build
      artifacts, and the count of unlicensed packages, which was 4 and is 5 — and
      both were found only when a generator re-derived them, so a typed number is a
      claim carrying no gate.
    evidence:
      source: "kg-rag-cookbook:NLKE-production-quality-release-V1.0.0.md §1 honesty note 3; both corrected by TS-kg-rag-of-kg-rag.py release, 2026-09-01"
      result: "2 of 2 hand-typed aggregates wrong; 0 wrong after generation"
      n: "2 aggregates"

  - id: badge-counts-are-not-function-counts
    name: "Test-count badges and def test_ counts measure different things"
    category: measurement
    claim_type: existential
    status: ESTABLISHED
    verified_here: true
    claim: >-
      README badges and a def test_ grep disagree on every package where both exist
      — 80 against 107, 53 against 56, 25 against 29 — because one counts pytest
      cases and the other counts functions, so a column mixing them is meaningless
      whichever number is right.
    evidence:
      source: "declared_core:README.md badge (80) vs grep 107; NLKE-mud-detection badge (53) vs 56; claude-arch-inventory badge (25) vs 29 — measured 2026-09-01"
      result: "3 of 3 packages disagree; frontmatter_rag agrees at 73 by coincidence"
      n: "4 packages with badges"

# ---------------------------------------------------------------------------
# TypeScript translation targets. Rank and effort are judgements; what already
# exists in TypeScript is not.
# ---------------------------------------------------------------------------

ts_target:
  - id: ts-kg-schema-integrity
    name: "kg_toolkit schema + integrity -> TypeScript"
    tier: 1
    rank: 1
    source_lines: 749
    status: LANDED
    dest: "multi-graph-memory:src/kg/{types,integrity}.ts"
    summary: >-
      Typed KG with edge endpoint constraints and a real integrity report. Nothing
      in the TypeScript estate does this; hybrid-graph-memory stores relations but
      never validates them.
    evidence:
      source: "kg_toolkit:kg_toolkit/schema.py (456L) + integrity.py (293L); absent from all four TS lineages per estate inventory 2026-09-01"

  - id: ts-dimension-palette
    name: "declared_core 12-dimension palette + scorer -> TypeScript"
    tier: 1
    rank: 2
    source_lines: 333
    dest: "multi-graph-memory:src/relevance/dimensions.ts"
    summary: >-
      The interpretable named-attribute signal. The TS engine has vectors and
      lexical scoring and no third signal of this kind.
    evidence:
      source: "declared_core:declared_core/dimensions/{schema.py:101L,scorer.py:232L}; no TS equivalent found 2026-09-01"

  - id: ts-mud-gate
    name: "mud-detection screen/gate -> TypeScript"
    tier: 1
    rank: 3
    source_lines: null
    dest: "multi-graph-memory:src/relevance/admission.ts"
    summary: >-
      The admission gate that stops cycle M2's fusion graft from silently
      regressing recall, and every signal added after it.
    evidence:
      source: "NLKE-mud-detection:mud_detection/{screen,gate,correlate}.py; the parent-boost incident is the failure it prevents"

  - id: ts-structural-expansion
    name: "declared_core structural expansion -> TypeScript"
    tier: 2
    rank: 4
    source_lines: 197
    dest: "multi-graph-memory:src/relevance/structural.ts"
    summary: "Graph-neighbourhood expansion as a retrieval signal; missing in TS."
    evidence:
      source: "declared_core:declared_core/retrieval/structural.py (197L)"

  - id: ts-eval-metrics
    name: "rag_evaluator ranking metrics -> TypeScript"
    tier: 2
    rank: 5
    source_lines: null
    dest: "multi-graph-memory:src/eval/metrics.ts"
    summary: >-
      Six ranking metrics, pure standard library. Lower priority because the Python
      harness can score the TypeScript engine's output externally in the meantime.
    evidence:
      source: "rag_evaluator:rag_evaluator/metrics.py"

# ---------------------------------------------------------------------------
# Edges. Every one carries evidence.source, exactly like a finding — without that
# rule, contradiction curation is editorialising with extra steps.
# ---------------------------------------------------------------------------

edges:

  contradicts:
    - source: "fusion_method::rrf-k60-unified-retriever"
      target: "fusion_method::alpha-dense-bm25-hybrid-retriever"
      why: "Rank-based fusion that needs no calibration, against a score blend that requires min-max normalisation. They cannot both be the estate's fusion method."
      evidence:
        source: "flags:eco-system/unified_retriever.py:4-9 vs hybrid_retriever.py:296-314"
    - source: "fusion_method::alpha-dense-bm25-hybrid-retriever"
      target: "fusion_method::intent-adaptive-abg-fusion-weights"
      why: "Two signals against three, and a single alpha against eight per-intent triples, in the same package."
      evidence:
        source: "flags:eco-system/hybrid_retriever.py:176-187 vs fusion_weights.py:29-68"
    - source: "fusion_method::intent-adaptive-abg-fusion-weights"
      target: "fusion_method::three-signal-abg-doc"
      why: "Same three signals, different weights: per-intent adaptive triples against a documented fixed 0.40/0.45/0.15."
      evidence:
        source: "flags:eco-system/fusion_weights.py:146-170 vs dimensions-custom-queries/custom-retrival-systems-2026-05-23.md §1.6"
    - source: "fusion_method::semantic-keyword-0604"
      target: "fusion_method::three-signal-abg-doc"
      why: "A two-signal unnormalised blend against a three-signal calibrated one, both presented as the hybrid recipe."
      evidence:
        source: "flags:eco-system/semantic_retriever.py:334-340 vs custom-retrival-systems-2026-05-23.md §1.6"
    - source: "dimension::dim-56-dimension-config"
      target: "dimension::dim-80-llm-brain"
      why: "80 claims to contain the 56 as a subset but hardcodes its own list and never imports it, so the containment is unverified."
      evidence:
        source: "flags:python-scripts/llm_brain_extractor.py:11-14,77-212 vs eco-system/embeddings/dimension_config.py:615"
    - source: "dimension::dim-44-enhanced-scorer"
      target: "dimension::dim-56-dimension-config"
      why: "The scorer enforces 44 while the registry it scores against defines 56 — 12 dimensions are unscored."
      evidence:
        source: "flags:eco-system/embeddings/enhanced_dimension_scorer.py:21 vs dimension_config.py:615"
    - source: "dimension::dim-640-extended-schema"
      target: "dimension::dim-56-dimension-config"
      why: "640 declared against 94 defined, its placeholders naming the 56-registry as the source of a 70 it does not contain."
      evidence:
        source: "flags:eco-system/dimensions/extended_schema.py:96,103-863; schema_bridge.py:70-75"
    - source: "dimension::dim-196-44-unified-embedding"
      target: "dimension::dim-46-hybrid-embedder"
      why: "Three further counts — 196, 44 and 46 — none of which agrees with any registry or with each other."
      evidence:
        source: "flags:eco-system/unified_embedding_retriever.py:8,126 vs embeddings/hybrid_embedder.py:7"

  supersedes:
    - source: "fusion_method::rrf-declared-core"
      target: "fusion_method::rrf-k60-unified-retriever"
      why: "Same algorithm, adjudicated: zero required dependencies, 107 test functions, and six packages depend on it."
      evidence:
        source: "declared_core:declared_core/retrieval/rrf.py; depends_on edges measured by this builder"
    - source: "fusion_method::rrf-declared-core"
      target: "fusion_method::alpha-dense-bm25-hybrid-retriever"
      why: "Rank fusion removes the score-calibration requirement the alpha blend cannot avoid."
      evidence:
        source: "flags:eco-system/unified_retriever.py:4-9 (the argument), declared_core:retrieval/rrf.py (the shipped form)"
    - source: "fusion_method::rrf-declared-core"
      target: "fusion_method::intent-adaptive-abg-fusion-weights"
      why: "The eight-intent table was the most developed gen-1 model and still requires a calibrated triple per project; RRF does not."
      evidence:
        source: "flags:eco-system/fusion_weights.py:29-68 vs declared_core:retrieval/rrf.py"
    - source: "dimension::dim-12-declared-core"
      target: "dimension::dim-56-dimension-config"
      why: "Twelve measured, curated dimensions replace accumulation — the gen-2 answer is rejection, not reconciliation."
      evidence:
        source: "kg_toolkit:kg_toolkit/dimensions.py:1-13; NLKE-primitives-library README (4 of 6 rhetorical-role dimensions mechanically rejected)"
    - source: "dimension::dim-12-declared-core"
      target: "dimension::dim-640-extended-schema"
      why: "640 declared against 94 defined is the failure mode a curated palette plus an admission gate exists to end."
      evidence:
        source: "flags:eco-system/dimensions/extended_schema.py:96 vs kg_toolkit:kg_toolkit/dimensions.py"

  measures:
    - source: "eval_harness::measure-retrieval"
      target: "finding::scoped-indexes-beat-one-index"
      evidence: { source: "NLKE-primitives-library:tools/measure_retrieval.py" }
    - source: "eval_harness::mud-detection-gate"
      target: "finding::parent-boost-regression"
      evidence: { source: "NLKE-mud-detection:README.md" }
    - source: "eval_harness::mud-detection-gate"
      target: "finding::correlation-alone-does-not-convict"
      evidence: { source: "NLKE-mud-detection:mud_detection/correlate.py" }
    - source: "eval_harness::kg-toolkit-integrity"
      target: "finding::duplicate-declared-ids"
      evidence: { source: "this builder's declared_id_collisions check" }
    - source: "eval_harness::validate-recall-gen1"
      target: "finding::gen1-dimension-counts-contradict"
      evidence: { source: "flags:eco-system/validate_recall.py scores retrieval over the registries that disagree" }
    - source: "eval_harness::rag-evaluator"
      target: "finding::badge-counts-are-not-function-counts"
      evidence: { source: "rag_evaluator:rag_evaluator/metrics.py — one measure per column, named" }

  implements:
    - source: "module::declared_core/declared_core/retrieval/rrf.py"
      target: "fusion_method::rrf-declared-core"
      evidence: { source: "declared_core:declared_core/retrieval/rrf.py" }
    - source: "module::kg_toolkit/kg_toolkit/dimensions.py"
      target: "dimension::dim-12-declared-core"
      evidence: { source: "kg_toolkit:kg_toolkit/dimensions.py:1-13" }

  translates_to:
    - source: "module::kg_toolkit/kg_toolkit/schema.py"
