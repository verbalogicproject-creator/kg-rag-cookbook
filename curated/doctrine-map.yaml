# Which doctrine rule each finding answers to, declared rather than derived.
#
# Category is a heuristic and it was wrong for 23 of 56 findings. This maps by
# declared id instead, so the link is a decision on record. Keys are the entry id
# from the source card; a finding whose id is absent here falls back to its
# category, and if that maps to nothing it stays unlinked and visible.
#
# evidence.source names where the rule is already stated in the estate — none of
# these six rules is invented here.

